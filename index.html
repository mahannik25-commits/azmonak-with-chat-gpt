<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمون‌پلاس | آزمون آنلاین</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c31;--line:#283653;--a:#7c5cff;--b:#23d5ab;--txt:#f4f6ff;--muted:#aab5d0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1c2850,var(--bg) 55%);font-family:Tahoma,Arial,sans-serif;color:var(--txt);min-height:100vh}main{width:min(900px,100%);margin:auto;padding:22px 15px 45px}.hero{text-align:center;padding:22px 8px}.logo{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,var(--a),var(--b));font-size:30px;box-shadow:0 10px 35px #7c5cff44}h1{margin:12px 0 8px;font-size:clamp(25px,6vw,38px)}p{color:var(--muted);line-height:1.9}.panel{background:#141c31ef;border:1px solid var(--line);border-radius:22px;padding:18px;margin:15px 0;box-shadow:0 14px 35px #0002}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}.subject{border:1px solid var(--line);border-radius:15px;padding:16px 10px;background:#1a2540;color:var(--txt);cursor:pointer;font:inherit;transition:.2s}.subject:hover{border-color:var(--b);transform:translateY(-2px)}button{font:inherit}.primary{background:linear-gradient(100deg,var(--a),#5865f2);color:white;border:0;padding:13px 18px;border-radius:13px;cursor:pointer;font-weight:bold}.secondary{background:#222e49;color:var(--txt);border:1px solid var(--line);padding:11px 15px;border-radius:12px;cursor:pointer}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:14px}.bar{height:8px;background:#293653;border-radius:20px;overflow:hidden;margin:13px 0 22px}.fill{height:100%;background:linear-gradient(90deg,var(--a),var(--b));width:0;transition:width .25s}.question{font-size:20px;line-height:1.9}.answers{display:grid;gap:10px;margin:18px 0}.answer{padding:14px;text-align:right;background:#1a2540;border:1px solid var(--line);border-radius:13px;color:var(--txt);cursor:pointer}.answer.selected{border-color:var(--a);background:#30275c}.answer.correct{border-color:var(--b);background:#103e3b}.answer.wrong{border-color:#ff6c88;background:#492235}.feedback{line-height:1.8;padding:12px;border-radius:12px;background:#202c45;color:var(--muted);margin:10px 0}.hidden{display:none}.score{font-size:44px;font-weight:bold;color:var(--b)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body><main>
<header class="hero"><div class="logo">✦</div><h1>آزمون‌پلاس</h1><p>یاد بگیر، امتحان کن و رکوردت رو بهتر کن!<br>آزمون‌های کوتاه و رایگان برای همه</p></header>
<section id="home" class="panel"><h2>📚 یک موضوع انتخاب کن</h2><p>هر آزمون ۵ سؤال چهارگزینه‌ای دارد.</p><div id="subjects" class="grid"></div></section>
<section id="quiz" class="panel hidden"><div class="topline"><span id="subjectName"></span><span id="counter"></span></div><div class="bar"><div id="fill" class="fill"></div></div><h2 id="question" class="question"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden"></div><div class="topline"><button id="back" class="secondary">خروج از آزمون</button><button id="next" class="primary" disabled>سؤال بعدی ←</button></div></section>
<section id="result" class="panel hidden" style="text-align:center"><h2>🎉 آزمون تموم شد!</h2><div id="score" class="score"></div><p id="message"></p><div class="topline" style="justify-content:center;flex-wrap:wrap"><button id="retry" class="primary">تکرار آزمون</button><button id="again" class="secondary">انتخاب درس دیگر</button></div><div id="review" style="text-align:right;margin-top:20px"></div></section>
<footer>آزمون‌پلاس · رایگان برای یادگیری بهتر</footer></main>
<script>
const data={
"قرآن":[["کدام کتاب آسمانی بر پیامبر اسلام نازل شد؟",["تورات","قرآن","انجیل","زبور"],1,"قرآن کریم کتاب آسمانی مسلمانان است."],["سوره‌ای که با «الحمدلله» آغاز می‌شود کدام است؟",["ناس","کوثر","حمد","فلق"],2,"سوره حمد با عبارت الحمدلله آغاز می‌شود."],["قرآن چند جزء دارد؟",["۲۰","۲۵","۳۰","۴۰"],2,"قرآن کریم ۳۰ جزء دارد."],["آخرین سوره قرآن کدام است؟",["فلق","ناس","اخلاص","کوثر"],1,"سوره ناس آخرین سوره قرآن است."],["شب قدر در کدام ماه است؟",["رمضان","محرم","رجب","شوال"],0,"شب قدر در ماه رمضان قرار دارد."]],
"عربی":[["معنی «کتاب» چیست؟",["مدرسه","کتاب","خانه","درخت"],1,"کتاب در عربی هم به معنی کتاب است."],["«هذان» برای چیست؟",["مفرد مؤنث","مثنای مذکر","جمع","مثنای مؤنث"],1,"هذان برای دو اسم مذکر به کار می‌رود."],["جمع «طالب» کدام است؟",["طلاب","طالبان","طالبه","طلب"],0,"طلاب جمع رایج طالب است."],["معنی «السلام» چیست؟",["دانش","سلامتی/صلح","کتاب","آب"],1,"السلام به معنی صلح و سلامتی است."],["«مدرسة» یعنی چه؟",["دانشگاه","مدرسه","دفتر","معلم"],1,"مدرسة یعنی مدرسه."]],
"علوم":[["کدام سیاره به سیاره سرخ معروف است؟",["زمین","مریخ","زهره","مشتری"],1,"به دلیل رنگ سطحش مریخ را سیاره سرخ می‌نامند."],["گیاهان برای فتوسنتز به چه چیزی نیاز دارند؟",["نور","پلاستیک","آهن","شن"],0,"نور یکی از نیازهای اصلی فتوسنتز است."],["آب در فشار معمولی در چند درجه می‌جوشد؟",["۵۰","۷۵","۱۰۰","۱۵۰"],2,"آب خالص در فشار معمولی در ۱۰۰ درجه می‌جوشد."],["کدام اندام خون را پمپ می‌کند؟",["مغز","ریه","قلب","کبد"],2,"قلب خون را در بدن به گردش درمی‌آورد."],["زمین به دور چه چیزی می‌چرخد؟",["ماه","خورشید","مریخ","ستاره قطبی"],1,"زمین به دور خورشید گردش می‌کند."]],
"مطالعات اجتماعی":[["پایتخت ایران کدام است؟",["اصفهان","شیراز","تهران","تبریز"],2,"تهران پایتخت ایران است."],["کدام جهت روبه‌روی شمال است؟",["شرق","غرب","جنوب","شمال‌شرق"],2,"جنوب جهت مخالف شمال است."],["نقشه برای چه استفاده می‌شود؟",["نمایش مکان‌ها","پخت غذا","اندازه‌گیری دما","نوشتن شعر"],0,"نقشه مکان‌ها و ویژگی‌های جغرافیایی را نشان می‌دهد."],["بزرگ‌ترین اقیانوس جهان کدام است؟",["هند","آرام","منجمد شمالی","اطلس"],1,"اقیانوس آرام بزرگ‌ترین اقیانوس جهان است."],["کدام مورد منبع طبیعی است؟",["نفت","پلاستیک","شیشه","کاغذ رنگی"],0,"نفت یک منبع طبیعی است."]],
"فارسی":[["مترادف «خوشحال» کدام است؟",["غمگین","شاد","خسته","ترسیده"],1,"شاد هم‌معنی خوشحال است."],["کدام واژه اسم است؟",["دویدن","زیبا","کتاب","آرام"],2,"کتاب نام یک چیز است و اسم به شمار می‌رود."],["مخالف «آغاز» چیست؟",["شروع","پایان","حرکت","ورود"],1,"پایان مخالف آغاز است."],["کدام نشانه برای پرسش می‌آید؟",["؟","!","،","؛"],0,"علامت سؤال برای جمله پرسشی استفاده می‌شود."],["شاعر شاهنامه کیست؟",["حافظ","فردوسی","سعدی","مولوی"],1,"شاهنامه اثر حکیم ابوالقاسم فردوسی است."]],
"ریاضی":[["۷ × ۸ چند می‌شود؟",["۴۸","۵۴","۵۶","۶۴"],2,"۷ ضربدر ۸ برابر ۵۶ است."],["نصف ۹۰ چقدر است؟",["۳۰","۴۰","۴۵","۵۰"],2,"۹۰ تقسیم بر ۲ برابر ۴۵ است."],["محیط مربع با ضلع ۴ چقدر است؟",["۸","۱۲","۱۶","۲۰"],2,"محیط مربع برابر ۴ برابر ضلع است: ۴×۴=۱۶."],["کدام عدد زوج است؟",["۱۳","۲۱","۳۶","۴۵"],2,"عدد زوج بر ۲ بخش‌پذیر است."],["یک ساعت چند دقیقه است؟",["۳۰","۴۵","۶۰","۹۰"],2,"هر ساعت ۶۰ دقیقه است."]],
"زبان انگلیسی":[["معنی Apple چیست؟",["موز","سیب","پرتقال","انگور"],1,"Apple یعنی سیب."],["جمع Book چیست؟",["Bookes","Books","Bookies","Book"],1,"جمع معمول book با افزودن s ساخته می‌شود: books."],["معنی Hello چیست؟",["خداحافظ","لطفاً","سلام","ببخشید"],2,"Hello برای سلام کردن است."],["کدام رنگ به معنی Blue است؟",["قرمز","آبی","سبز","زرد"],1,"Blue یعنی آبی."],["جای خالی را کامل کن: I ___ a student.",["am","is","are","be"],0,"با I از am استفاده می‌کنیم."]],
"کامپیوتر":[["CPU بیشتر به چه چیزی معروف است؟",["پردازنده","نمایشگر","ماوس","بلندگو"],0,"CPU واحد پردازش مرکزی رایانه است."],["کدام دستگاه برای تایپ است؟",["اسکنر","صفحه‌کلید","مانیتور","بلندگو"],1,"برای تایپ از صفحه‌کلید استفاده می‌شود."],["HTML بیشتر برای چیست؟",["ساختار صفحه وب","ویرایش عکس","ضبط صدا","فشرده‌سازی"],0,"HTML ساختار محتوای صفحات وب را مشخص می‌کند."],["کدام یکی مرورگر وب است؟",["Chrome","Excel","Paint","Calculator"],0,"Chrome یک مرورگر وب است."],["کدام واحد برای ذخیره فایل استفاده می‌شود؟",["گیگابایت","کیلومتر","لیتر","درجه"],0,"گیگابایت یکی از واحدهای اندازه‌گیری داده است."]],
"دانستنی‌ها":[["کدام حیوان به سلطان جنگل معروف است؟",["ببر","شیر","فیل","گرگ"],1,"شیر به این لقب مشهور است."],["رنگ حاصل از ترکیب آبی و زرد چیست؟",["بنفش","سبز","نارنجی","صورتی"],1,"ترکیب آبی و زرد معمولاً سبز می‌شود."],["چند روز در یک هفته است؟",["۵","۶","۷","۸"],2,"هر هفته هفت روز دارد."],["کدام پرنده نمی‌تواند پرواز کند؟",["عقاب","گنجشک","شترمرغ","کبوتر"],2,"شترمرغ پرنده‌ای بزرگ و ناتوان از پرواز است."],["کدام سیاره بزرگ‌ترین سیاره منظومه شمسی است؟",["زمین","مشتری","عطارد","نپتون"],1,"مشتری بزرگ‌ترین سیاره منظومه شمسی است."]]
};
const $=id=>document.getElementById(id);let subject="",idx=0,answers=[],locked=false;
Object.keys(data).forEach(s=>{let b=document.createElement("button");b.className="subject";b.textContent=({"قرآن":"📖","عربی":"🕌","علوم":"🔬","مطالعات اجتماعی":"🌍","فارسی":"✍️","ریاضی":"➗","زبان انگلیسی":"🔤","کامپیوتر":"💻","دانستنی‌ها":"🧠"})[s]+"  "+s;b.onclick=()=>start(s);$("subjects").appendChild(b)});
function start(s){subject=s;idx=0;answers=[];$("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");showQ()}
function showQ(){locked=false;const q=data[subject][idx];$("subjectName").textContent=subject;$("counter").textContent=(idx+1)+" از "+data[subject].length;$("fill").style.width=(idx/data[subject].length*100)+"%";$("question").textContent=q[0];$("answers").innerHTML="";$("feedback").classList.add("hidden");$("next").disabled=true;$("next").textContent=idx===data[subject].length-1?"دیدن نتیجه":"سؤال بعدی ←";q[1].forEach((a,i)=>{let b=document.createElement("button");b.className="answer";b.textContent=["الف","ب","ج","د"][i]+" ـ "+a;b.onclick=()=>choose(i);$("answers").appendChild(b)})}
function choose(n){if(locked)return;locked=true;const q=data[subject][idx];answers[idx]=n;[...$("answers").children].forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add("correct");else if(i===n)b.classList.add("wrong")});$("feedback").textContent=(n===q[2]?"✅ آفرین، درست جواب دادی! ":"❌ این بار درست نبود. ")+q[4];$("feedback").classList.remove("hidden");$("next").disabled=false}
$("next").onclick=()=>{if(!locked)return;if(idx<data[subject].length-1){idx++;showQ()}else finish()};
function finish(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");let correct=answers.filter((a,i)=>a===data[subject][i][2]).length;$("score").textContent=(correct*4)+"/20";$("message").textContent=correct===5?"عالی بود! همه پاسخ‌ها درست بود.":correct>=3?"آفرین! خوب پیش رفتی؛ می‌تونی دوباره تمرین کنی.":"اشکالی نداره؛ جواب‌ها رو مرور کن و دوباره تلاش کن.";$("fill").style.width="100%";$("review").innerHTML="<h3>مرور پاسخ‌ها</h3>"+data[subject].map((q,i)=>'<p><b>'+(i+1)+'. '+q[0]+'</b><br>پاسخ درست: '+q[1][q[2]]+'<br><span style="color:var(--muted)">'+q[4]+'</span></p>').join("")}
$("back").onclick=()=>{$("quiz").classList.add("hidden");$("home").classList.remove("hidden")};$("retry").onclick=()=>start(subject);$("again").onclick=()=>{$("result").classList.add("hidden");$("home").classList.remove("hidden")};
</script>
</body></html>
