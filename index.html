<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آزمونک | سایت آزمون درس‌ها</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Tahoma, "Segoe UI", sans-serif; }
  body { min-height:100vh; background:linear-gradient(135deg,#1e3c72,#2a5298,#6a3093); display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; width:100%; max-width:640px; border-radius:20px; padding:30px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  h1 { text-align:center; color:#1e3c72; margin-bottom:8px; }
  .sub { text-align:center; color:#777; margin-bottom:24px; font-size:14px; }
  .subjects { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .subject-btn { padding:18px 10px; border:none; border-radius:14px; font-size:17px; font-weight:bold; color:#fff; cursor:pointer; transition:.15s; }
  .subject-btn:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.2); }
  .quran{background:linear-gradient(135deg,#11998e,#38ef7d)} .arabic{background:linear-gradient(135deg,#667eea,#764ba2)}
  .math{background:linear-gradient(135deg,#f7971e,#ffd200)} .science{background:linear-gradient(135deg,#56ab2f,#a8e063)}
  .farsi{background:linear-gradient(135deg,#ee0979,#ff6a00)} .social{background:linear-gradient(135deg,#2193b0,#6dd5ed)}
  .english{background:linear-gradient(135deg,#c31432,#240b36)}
  .progress { height:10px; background:#eee; border-radius:5px; overflow:hidden; margin-bottom:16px; }
  .progress-bar { height:100%; background:linear-gradient(90deg,#38ef7d,#11998e); width:0; transition:.3s; }
  .q-text { font-size:18px; font-weight:bold; color:#333; margin-bottom:20px; line-height:1.8; }
  .opt { display:block; width:100%; text-align:right; padding:14px 18px; margin-bottom:10px; border:2px solid #e0e0e0; border-radius:12px; background:#fafafa; cursor:pointer; font-size:16px; transition:.15s; }
  .opt:hover { border-color:#2a5298; background:#f0f4ff; }
  .opt.correct { border-color:#2ecc71; background:#eaffea; }
  .opt.wrong { border-color:#e74c3c; background:#ffeaea; }
  .hidden { display:none; }
  .nav { display:flex; justify-content:space-between; margin-top:16px; }
  .btn { padding:12px 26px; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; }
  .btn-primary { background:linear-gradient(135deg,#1e3c72,#2a5298); color:#fff; }
  .btn-gray { background:#eee; color:#555; }
  .result-circle { width:170px; height:170px; border-radius:50%; margin:20px auto; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-weight:bold; }
  .score { font-size:44px; } .outof { font-size:15px; opacity:.85; }
  .msg { text-align:center; font-size:18px; font-weight:bold; margin-bottom:6px; }
  .detail { text-align:center; color:#777; font-size:14px; margin-bottom:20px; }
  .center { text-align:center; }
</style>
</head>
<body>
<div class="card">
  <div id="home">
    <h1>📚 آزمونک</h1>
    <p class="sub">درس موردنظرت رو انتخاب کن، ۱۰ سوال چهارگزینه‌ای جواب بده و نمره از ۲۰ بگیر!</p>
    <div class="subjects" id="subjectList"></div>
  </div>

  <div id="quiz" class="hidden">
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <p class="sub" id="counter"></p>
    <div class="q-text" id="qText"></div>
    <div id="options"></div>
    <div class="nav">
      <button class="btn btn-gray" id="quitBtn">خروج</button>
      <button class="btn btn-primary hidden" id="nextBtn">بعدی ←</button>
    </div>
  </div>

  <div id="result" class="hidden">
    <p class="msg" id="resMsg"></p>
    <div class="result-circle" id="circle"><span class="score" id="score"></span><span class="outof">از ۲۰</span></div>
    <p class="detail" id="detail"></p>
    <div class="center">
      <button class="btn btn-primary" id="againBtn">🔄 آزمون دوباره</button>
    </div>
  </div>
</div>

<script>
const DATA = {
'قرآن':{c:'quran',q:[
 ['سوره حمد چند آیه دارد؟',['۵','۶','۷','۸'],2],
 ['«إِنَّا أَعْطَيْنَاکَ الْکَوْثَر» در کدام سوره آمده است؟',['کوثر','فاتحه','نصر','فلق'],0],
 ['مفهوم «کوثر» یعنی چه؟',['خیر و برکت فراوان','آبشار','نور','رحمت'],0],
 ['اولین سوره‌ای که نازل شد کدام بود؟',['فاتحه','علق','ناس','مدثر'],1],
 ['«أَلَمْ نَشْرَحْ لَکَ صَدْرَکَ» خطاب به چه کسی است؟',['موسی','عیسى','پیامبر اسلام','آدم'],2],
 ['آیه «إِنَّ مَعَ الْعُسْرِ یُسْرًا» یعنی چه؟',['با هر سختی آسانی است','صبر زیباست','علم نور است','تلاش لازم است'],0],
 ['سوره توحید درباره چه است؟',['توحید و یگانگی خدا','قصه پیامبران','معراج','قیامت'],0],
 ['سوره‌ای که در آن کلمه «الله» ذکر نشده کدام است؟',['کهف','مريم','توبه','یوسف'],2],
 ['«وَالضُّحٰی * وَاللَّیْلِ إِذا سَکٰی» مقدمه کدام سوره است؟',['شمس','ضحی','لیل','بین'],1],
 ['سوره فاتحه نام‌های دیگری هم دارد؛ کدام از آنها نیست؟',['سبع‌المثانی','ام‌الکتاب','شافیه','کافیه'],2]
]},
'عربی':{c:'arabic',q:[
 ['«الْعِلْمُ نورٌ» چه نوع جمله‌ای است؟',['اسمیه','فعلیه','شرطیه','نهی'],0],
 ['ترجمه «یَجْلِسُ» چیست؟',['می‌نشیند','نشست','بنشین','نمی‌نشیند'],0],
 ['جمع «کِتاب» کدام است؟',['کُتّاب','کِتابان','مکتوب','کاتب'],0],
 ['«هذا طالبٌ مجتهدٌ» — «مجتهد» چه نقشی دارد؟',['فاعل','صفة','مفعول','مبتدا'],1],
 ['معنای «البَیْت» چیست؟',['خانه','مدرسه','کتاب','مسجد'],0],
 ['فعل ماضی «ذَهَبَ» یعنی چه؟',['رفت','می‌رود','برو','رفتن'],0],
 ['جمع مکسر «قَلَم» کدام است؟',['أقلام','قلمون','قلمات','قالم'],0],
 ['معنای «اِفْتَتَحَ» چیست؟',['شروع کرد','باز کرد','بست','ساخت'],0],
 ['«یَومِ الجُمْعَة» یعنی چه؟',['روز جمعه','روز شنبه','آخر هفته','تعطیلات'],0],
 ['مقابل «الصَّغیر» کدام است؟',['الکبیر','الجمیل','الطویل','الضعیف'],0]
]},
'ریاضی':{c:'math',q:[
 ['حاصل ۱۵٪ از ۲۰۰ چند است؟',['۳۰','۲۵','۳۵','۴۰'],0],
 ['اگر x + 7 = 12 باشد، x چند است؟',['۴','۵','۶','۷'],1],
 ['مساحت مربعی با ضلع ۶ چند است؟',['۳۶','۲۴','۱۲','۴۸'],0],
 ['عدد اول کدام است؟',['۹','۱۵','۱۷','۲۱'],2],
 ['حاصل ۲³ × ۲² چند است؟',['۲⁵','۲⁶','۴⁵','۸'],0],
 ['میانگین اعداد ۴، ۸، ۱۲، ۱۶ چند است؟',['۸','۹','۱۰','۱۲'],2],
 ['زاویه‌های مثلث مجموعاً چند درجه‌اند؟',['۹۰','۱۸۰','۲۷۰','۳۶۰'],1],
 ['کسر معادل ۳/۴ کدام است؟',['۶/۸','۴/۶','۳/۶','۵/۸'],0],
 ['اگر کالایی ۵۰۰۰۰ تومانی با ۲۰٪ تخفیف بخریم چند می‌پردازیم؟',['۴۰۰۰۰','۴۲۰۰۰','۴۵۰۰۰','۳۸۰۰۰'],0],
 ['حاصل (−۳) × (−۴) چند است؟',['−۱۲','۱۲','۷','۱'],1]
]},
'علوم':{c:'science',q:[
 ['بزرگ‌ترین سیاره منظومه شمسی کدام است؟',['زحل','مشتری','نپتون','زمین'],1],
 ['آب در چند درجه سلسیوس می‌جوشد (سطح دریا)؟',['۹۰','۹۵','۱۰۰','۱۱۰'],2],
 ['کدام اندام خون را تصفیه می‌کند؟',['کبد','کلیه','قلب','معده'],1],
 ['فرآیند جذب نور توسط برگ گیاهان چه نام دارد؟',['نفس‌کشی','فتوسنتز','تعرق','جذب'],1],
 ['سرعت نور تقریباً چند کیلومتر بر ثانیه است؟',['۳۰۰ هزار','۳ میلیون','۳۰ هزار','۳ میلیارد'],0],
 ['بزرگ‌ترین اندام بدن انسان چیست؟',['کبد','مغز','پوست','ریه'],2],
 ['اتم از چه تشکیل شده است؟',['پروتون، نوترون و الکترون','فقط پروتون','فقط الکترون','مولکول'],0],
 ['کدام گاز بیشترین مقدار در جو زمین را دارد؟',['اکسیژن','نیتروژن','کربن‌دی‌اکسید','هیدروژن'],1],
 ['نظریه نسبیت را چه کسی مطرح کرد؟',['نیوتن','انیشتین','ادیسون','گالیله'],1],
 ['گردش زمین به دور خورشید چند روز طول می‌کشد؟',['۳۶۵ روز','۲۴ ساعت','۳۰ روز','۱۸۰ روز'],0]
]},
'فارسی':{c:'farsi',q:[
 ['شاهنامه اثر چه کسی است؟',['سعدی','فردوسی','حافظ','مولوی'],1],
 ['مثنوی معنوی از چه کسی است؟',['مولوی','حافظ','سعدی','نظامی'],0],
 ['«گلستان» نوشته کیست؟',['فردوسی','سعدی','خیام','جامی'],1],
 ['قالب‌های اصلی شعر فارسی کدام است؟',['قصیده، غزل، مثنوی، قطعه','رمان، نمایشنامه','نثر، نظم','هیچ‌کدام'],0],
 ['«هر که بامش بیش برفش بیشتر» چه نوع جمله است؟',['ضرب‌المثل','داستان','شعر','مقاله'],0],
 ['مفهوم واژه «کریم» چیست؟',['بخشنده','سخاوتمند','دروغگو','ترسو'],0],
 ['نویسنده «بوف کور» کیست؟',['صادق هدایت','جلال آل‌احمد','محمدعلی جمالزاده','بزرگ علوی'],0],
 ['حافظ بیشتر در چه قالبی شعر سروده؟',['غزل','مثنوی','قصیده','دو بیتی'],0],
 ['سبک هندی بیشتر درباره چه است؟',['شعر و معشوق','علم','تاریخ','فلسفه'],0],
 ['نثر آهنگین یعنی چه؟',['نثری که آهنگ و لحن موزون دارد','شعر','داستان کوتاه','مقاله'],0]
]},
'مطالعات':{c:'social',q:[
 ['پایتخت ایران کدام شهر است؟',['اصفهان','تهران','شیراز','مشهد'],1],
 ['طولانی‌ترین رود ایران کدام است؟',['کارون','سفیدرود','دجله','زاینده‌رود'],0],
 ['ایران در چه قاره‌ای قرار دارد؟',['آسیا','اروپا','آفریقا','امریکا'],0],
 ['کوه دماوند در کدام استان است؟',['مازندران','تهران','گیلان','یزد'],0],
 ['مرداد چندمین ماه سال شمسی است؟',['پنجم','ششم','هفتم','چهارم'],0],
 ['پرجمعیت‌ترین کشور جهان کدام است؟',['هند','چین','امریکا','اندونزی'],0],
 ['دریای شمال ایران چه نام دارد؟',['دریای خزر','دریای عمان','خلیج فارس','دریای مرمره'],0],
 ['منبع تجدیدناپذیر انرژی کدام است؟',['نفت','خورشید','باد','آب'],0],
 ['نیمکره شمالی زمین بیشتر خشکی‌ها را دارد؛ درست است؟',['درست','غلط','',''],0],
 ['شورای شهر چه وظیفه‌ای دارد؟',['مدیریت شهر','قانون‌گذاری کشور','امور نظامی','قضاوت'],0]
]},
'انگلیسی':{c:'english',q:[
 ['She ___ to school every day.',['go','goes','going','gone'],1],
 ['Past tense of "write" is:',['wrote','writed','written','writing'],0],
 ['Plural of "book" is:',['bookes','books','bookies','book'],1],
 ['I ___ a student.',['am','is','are','be'],0],
 ['Opposite of "big" is:',['small','tall','long','fast'],0],
 ['He ___ football yesterday.',['played','play','plays','playing'],0],
 ['"Where ___ you from?"',['are','is','am','do'],0],
 ['Comparative of "good" is:',['gooder','better','best','more good'],1],
 ['"school" means:',['مدرسه','خانه','کتاب','دوست'],0],
 ['She ___ TV now.',['is watching','watch','watches','watched'],0]
]}
};

let subject=null, qIndex=0, score=0, selected=null, order=[];

const $ = id => document.getElementById(id);

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function showHome(){
  ['quiz','result'].forEach(i=>$(i).classList.add('hidden'));
  $('home').classList.remove('hidden');
  const list=$('subjectList'); list.innerHTML='';
  for(const [name,{c}] of Object.entries(DATA)){
    const b=document.createElement('button');
    b.className='subject-btn '+c; b.textContent=name;
    b.onclick=()=>startQuiz(name);
    list.appendChild(b);
  }
}

function startQuiz(name){
  subject=name; score=0; qIndex=0;
  order=shuffle(DATA[name].q).slice(0,10);
  $('home').classList.add('hidden');
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  showQ();
}

function showQ(){
  const [text,opts,ans]=order[qIndex];
  $('bar').style.width=((qIndex)/order.length*100)+'%';
  $('counter').textContent=subject+' — سوال '+(qIndex+1)+' از '+order.length;
  $('qText').textContent=text;
  const box=$('options'); box.innerHTML=''; selected=null;
  $('nextBtn').classList.add('hidden');
  shuffle(opts.map((o,i)=>({o,i}))).forEach(({o,i})=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o;
    b.onclick=()=>{ if(selected!==null)return; selected=i;
      [...box.children].forEach(x=>{ if(x.textContent===opts[ans]) x.classList.add('correct'); });
      if(i!==ans) b.classList.add('wrong'); else score++;
      $('nextBtn').classList.remove('hidden');
    };
    box.appendChild(b);
  });
}

$('nextBtn').onclick=()=>{ if(qIndex<order.length-1){ qIndex++; showQ(); } else showResult(); };
$('quitBtn').onclick=showHome;
$('againBtn').onclick=showHome;

function showResult(){
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  const n=Math.round(score*2*10)/10;
  $('score').textContent=n;
  const pct=score/order.length;
  const col=pct>=0.8?'linear-gradient(135deg,#38ef7d,#11998e)':pct>=0.5?'linear-gradient(135deg,#f7971e,#ffd200)':'linear-gradient(135deg,#c31432,#240b36)';
  $('circle').style.background=col;
  $('resMsg').textContent = pct>=0.8?'آفرین! عالی بود':pct>=0.5?'خوب بود، بهتر هم می‌شی':'تلاشت رو کن، دوباره امتحان کن!';
  $('detail').textContent='پاسخ درست: '+score+' از '+order.length+' سوال';
}

showHome();
</script>
</body>
</html>
